<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262B"/>
      <stop offset="100%" stop-color="#18191C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#383A42" stroke-width="2"/>

  <!-- Cat Head Silhouette -->
  <!-- Left Ear -->
  <polygon points="26,62 34,22 60,46" fill="#F1F5F9"/>
  <polygon points="32,56 38,30 54,46" fill="#F472B6" opacity="0.8"/>

  <!-- Right Ear -->
  <polygon points="102,62 94,22 68,46" fill="#F1F5F9"/>
  <polygon points="96,56 90,30 74,46" fill="#F472B6" opacity="0.8"/>

  <!-- Face Body -->
  <path d="M 26,62 C 26,48 40,44 64,44 C 88,44 102,48 102,62 C 102,94 88,102 64,102 C 40,102 26,94 26,62 Z" fill="#F1F5F9"/>

  <!-- Left Eye: Terminal Prompt '>' -->
  <path d="M 44,66 L 54,73 L 44,80" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Eye: Blinking Cursor '_' -->
  <line x1="74" y1="79" x2="86" y2="79" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Subtle Cute Nose / Mouth -->
  <path d="M 61,81 Q 64,83 67,81" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 64,83 Q 61,87 57,86" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 64,83 Q 67,87 71,86" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheek Blushes -->
  <ellipse cx="36" cy="78" rx="4" ry="2" fill="#FDA4AF" opacity="0.6"/>
  <ellipse cx="92" cy="78" rx="4" ry="2" fill="#FDA4AF" opacity="0.6"/>

  <!-- Status Bar Healthy Green Indicator Dot -->
  <circle cx="104" cy="104" r="8" fill="#10B981" stroke="#18191C" stroke-width="2.5"/>
  <circle cx="104" cy="104" r="3" fill="#A7F3D0"/>
</svg>
